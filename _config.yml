# ════════════════════════════════════════════════════════════════════
# Seth (Feng) Li · sethfengli.com — Jekyll / GitHub Pages 站点配置
# 站点结构：index.html 拼装 _includes/ 下各分区，样式在 assets/css/，
# 交互与双语在 assets/js/main.js。README.md 仅作为 GitHub 仓库首页。
#
# 内容模型（改内容前先读这一段）
#   英文正文写在 _includes/*.html 里（利于 SEO 与无 JS 访问），
#   中文文案集中在 assets/js/main.js 的 ZH 字典，双语由 data-i18n 键关联。
#   改写文案前先看 README 的「写作规则」：说人话、具体压过形容词、
#   中文是写出来的而不是翻出来的。改动后必须运行 node tools/site-verify.mjs。
#
# 版本节奏
#   页脚、首屏 HUD 与「当下与下一步」都带 rev 标记（形如 2026.10），
#   「复查于」写完整日期（形如 2026-10-04）。每次实质更新内容：
#   1) 把四处 rev 与那一处日期改成同一次复查；2) 在 ai.html 的
#   「本页变化」里写清改了什么（写给访客看，不是写给自己的日记）；
#   3) 同步 head.html 里 JSON-LD 的 dateModified；4) 重跑校验。
# ════════════════════════════════════════════════════════════════════

# ── 基础站点信息 ──────────────────────────────────────────────
# 与 _includes/head.html 的 <title> 保持同一句话：jekyll-seo-tag 会再发一个
# <title>，两处不一致时浏览器取靠前的那个，说不清哪个生效。
title: "Seth (Feng) Li — Full-Stack & Database Engineer, Sydney"
description: >-
  Seth (Feng) Li — full-stack and database engineer in Sydney. 33 years in production: .NET 10 / C#,
  Python, TypeScript, SQL and AWS. He rebuilt his company's core portfolio systems to 1/225 of the
  compute they once needed, started an AI research group that read financial tables out of PDFs, and
  is now working on the retrieval, agent and evaluation layers around AI models.
  Founder of Feng Tech (fengtech.com.au) and creator of Hui Deng Zen Temple (zen.sethfengli.com).

url: "https://sethfengli.com"
lang: en
timezone: Australia/Sydney

# ── 插件（GitHub Pages 白名单）─────────────────────────────
# 只装这两个。jekyll-feed 曾被考虑过：本站没有 _posts，它只会生成一个空
# feed，多一个"永远没有更新"的地址，不如不做。需要 RSS 时先有内容再装。
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ── 作者与社交（生成 JSON-LD Person / sameAs）───────────────
author:
  name: Seth Li
social:
  name: Seth Li
  links:
    - https://www.linkedin.com/in/sethfengli
    - https://github.com/seth2000
    - https://zen.sethfengli.com/
    - https://www.fengtech.com.au/

# og:image（Open Graph 分享图；使用 GitHub 头像，稳定且可免费商用）
logo: https://avatars.githubusercontent.com/u/13928333?v=4

# ── 构建 ──────────────────────────────────────────────────
# .well-known 以点开头，Jekyll 默认忽略；证书校验与域名验证文件必须发布。
include:
  - .well-known

# 本地/仓库文件，不要进入站点产物。
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
