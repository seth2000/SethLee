<script>
/* 提前应用语言与主题偏好，避免首屏闪烁。
   - 语言：优先本地存储；否则按浏览器语言（zh* → 中文，其余英文）。
   - 主题：优先本地存储；否则按浏览器本地时区时间（06:00–18:00 白天 / 其余夜晚）。
   无 JS 时默认英文 + 浅色（:root 即浅色）。 */
(function () {
  try {
    var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var put = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };

    var theme = get('sl-theme');
    if (theme !== 'light' && theme !== 'night') {
      var h = new Date().getHours();
      theme = (h >= 6 && h < 18) ? 'light' : 'night';
      put('sl-theme', theme);
    }

    var lang = get('sl-lang');
    if (lang !== 'zh' && lang !== 'en') {
      var l = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      lang = (l.indexOf('zh') === 0) ? 'zh' : 'en';
      put('sl-lang', lang);
    }

    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
    document.documentElement.classList.add('js');
  } catch (e) {}
})();
</script>
