<div class="browser-frame card reveal">
  <div class="browser-bar">
    <span class="browser-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="browser-url">{{ include.url }}</span>
    <div class="browser-tools" role="group" aria-label="Device preview">
      <button type="button" data-device="desktop" class="on" aria-pressed="true" data-i18n="frame.desktop">Desktop</button>
      <button type="button" data-device="tablet" aria-pressed="false" data-i18n="frame.tablet">Tablet</button>
      <button type="button" data-device="mobile" aria-pressed="false" data-i18n="frame.mobile">Mobile</button>
      <a class="btn btn-ghost btn-sm" href="{{ include.url }}" target="_blank" rel="noopener" data-i18n="frame.open">Open ↗</a>
    </div>
  </div>
  <!-- The live site is fetched only when this frame nears the viewport (or on
       request), so third-party CSS/JS never blocks first paint. -->
  <div class="browser-stage" data-frame-url="{{ include.url }}" data-frame-title="{{ include.title }}">
    <button type="button" class="frame-load" aria-label="Load live preview of {{ include.url }}">
      <span class="frame-load__play" aria-hidden="true">▶</span>
      <b data-i18n="frame.loadLabel">Load live preview</b>
      <em data-i18n="frame.loadNote">Third-party page — it loads only when you ask or scroll here.</em>
    </button>
    <!-- A loaded frame keeps a way back: the reload chip clears the stage and
         loads it again, and the bar's Open link is always there if the third
         party is down. Without this the stage became a permanent empty box. -->
    <button type="button" class="frame-reload" data-reload>
      <svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 6.1M20 5v6h-6" />
      </svg><span data-i18n="frame.reload">Reload</span>
    </button>
  </div>
</div>
